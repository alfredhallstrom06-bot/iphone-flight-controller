<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Flight Controller</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 20px;
        }

        button {
            font-size: 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }

        .box {
            background: #222;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .motor {
            font-size: 20px;
            margin: 8px 0;
        }

        .value {
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>iPhone Flight Controller</h1>

<button onclick="startSensors()">Starta sensorer</button>

<div class="box">
    <h2>Attitude</h2>

    Roll:
    <span id="roll" class="value">0</span>°

    <br><br>

    Pitch:
    <span id="pitch" class="value">0</span>°

    <br><br>

    Yaw rate:
    <span id="yawRate" class="value">0</span> °/s
</div>

<div class="box">
    <h2>PID Roll</h2>

    Error:
    <span id="rollError">0</span><br>

    P:
    <span id="rollP">0</span><br>

    I:
    <span id="rollI">0</span><br>

    D:
    <span id="rollD">0</span><br>

    <b>Total:</b>
    <span id="rollOutput">0</span>
</div>

<div class="box">
    <h2>PID Pitch</h2>

    Error:
    <span id="pitchError">0</span><br>

    P:
    <span id="pitchP">0</span><br>

    I:
    <span id="pitchI">0</span><br>

    D:
    <span id="pitchD">0</span><br>

    <b>Total:</b>
    <span id="pitchOutput">0</span>
</div>

<div class="box">
    <h2>Virtual Motors</h2>

    <div class="motor">
        M1:
        <span id="m1" class="value">50</span>%
    </div>

    <div class="motor">
        M2:
        <span id="m2" class="value">50</span>%
    </div>

    <div class="motor">
        M3:
        <span id="m3" class="value">50</span>%
    </div>

    <div class="motor">
        M4:
        <span id="m4" class="value">50</span>%
    </div>
</div>

<script>

let roll = 0;
let pitch = 0;

let lastTime = null;

// Sensor fusion
const gyroWeight = 0.98;
const accelWeight = 0.02;


// PID settings

const rollP_gain = 1.2;
const rollI_gain = 0.02;
const rollD_gain = 0.15;

const pitchP_gain = 1.2;
const pitchI_gain = 0.02;
const pitchD_gain = 0.15;


// Integral
let rollIntegral = 0;
let pitchIntegral = 0;


// Target angles
const targetRoll = 0;
const targetPitch = 0;


// Base throttle
const baseThrottle = 50;


// Maximum PID correction
const maxPID = 25;


async function startSensors() {

    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {

        const permission =
            await DeviceMotionEvent.requestPermission();

        if (permission !== "granted") {
            alert("Sensoråtkomst nekades.");
            return;
        }
    }

    window.addEventListener("devicemotion", handleMotion);

    alert("Sensorer startade!");
}


function handleMotion(event) {

    const acc = event.accelerationIncludingGravity;
    const gyro = event.rotationRate;

    if (!acc || !gyro) return;


    // =========================
    // TIME
    // =========================

    const now = performance.now();

    if (lastTime === null) {
        lastTime = now;
        return;
    }

    let dt = (now - lastTime) / 1000;

    lastTime = now;

    // Prevent strange values
    if (dt <= 0 || dt > 0.1) {
        dt = 0.01;
    }


    // =========================
    // ACCELEROMETER ANGLES
    // =========================

    const accelRoll =
        Math.atan2(acc.y, acc.z)
        * 180 / Math.PI;

    const accelPitch =
        Math.atan2(
            -acc.x,
            Math.sqrt(
                acc.y * acc.y +
                acc.z * acc.z
            )
        )
        * 180 / Math.PI;


    // =========================
    // GYRO
    // =========================

    const gyroRollRate = gyro.beta || 0;
    const gyroPitchRate = gyro.gamma || 0;
    const gyroYawRate = gyro.alpha || 0;


    // =========================
    // SENSOR FUSION
    // =========================

    roll += gyroRollRate * dt;
    pitch += gyroPitchRate * dt;


    roll =
        gyroWeight * roll +
        accelWeight * accelRoll;

    pitch =
        gyroWeight * pitch +
        accelWeight * accelPitch;


    // =========================
    // PID ROLL
    // =========================

    const rollError =
        targetRoll - roll;


    // P
    const rollP =
        rollP_gain * rollError;


    // I
    rollIntegral += rollError * dt;

    // Anti-windup
    rollIntegral =
        Math.max(
            -100,
            Math.min(100, rollIntegral)
        );

    const rollI =
        rollI_gain * rollIntegral;


    // D
    // Gyro rate is used directly
    const rollD =
        -rollD_gain * gyroRollRate;


    let rollOutput =
        rollP +
        rollI +
        rollD;


    // Limit
    rollOutput =
        Math.max(
            -maxPID,
            Math.min(maxPID, rollOutput)
        );


    // =========================
    // PID PITCH
    // =========================

    const pitchError =
        targetPitch - pitch;


    // P
    const pitchP =
        pitchP_gain * pitchError;


    // I
    pitchIntegral += pitchError * dt;

    pitchIntegral =
        Math.max(
            -100,
            Math.min(100, pitchIntegral)
        );

    const pitchI =
        pitchI_gain * pitchIntegral;


    // D
    const pitchD =
        -pitchD_gain * gyroPitchRate;


    let pitchOutput =
        pitchP +
        pitchI +
        pitchD;


    pitchOutput =
        Math.max(
            -maxPID,
            Math.min(maxPID, pitchOutput)
        );


    // =========================
    // MOTOR MIXER
    // =========================

    let motor1 = baseThrottle;
    let motor2 = baseThrottle;
    let motor3 = baseThrottle;
    let motor4 = baseThrottle;


    // Roll

    motor1 -= rollOutput;
    motor2 += rollOutput;
    motor3 += rollOutput;
    motor4 -= rollOutput;


    // Pitch

    motor1 -= pitchOutput;
    motor2 -= pitchOutput;
    motor3 += pitchOutput;
    motor4 += pitchOutput;


    // Limit motors 0-100%

    motor1 =
        Math.max(0, Math.min(100, motor1));

    motor2 =
        Math.max(0, Math.min(100, motor2));

    motor3 =
        Math.max(0, Math.min(100, motor3));

    motor4 =
        Math.max(0, Math.min(100, motor4));


    // =========================
    // DISPLAY
    // =========================

    document.getElementById("roll").textContent =
        roll.toFixed(2);

    document.getElementById("pitch").textContent =
        pitch.toFixed(2);

    document.getElementById("yawRate").textContent =
        gyroYawRate.toFixed(2);


    document.getElementById("rollError").textContent =
        rollError.toFixed(2);

    document.getElementById("rollP").textContent =
        rollP.toFixed(2);

    document.getElementById("rollI").textContent =
        rollI.toFixed(2);

    document.getElementById("rollD").textContent =
        rollD.toFixed(2);

    document.getElementById("rollOutput").textContent =
        rollOutput.toFixed(2);


    document.getElementById("pitchError").textContent =
        pitchError.toFixed(2);

    document.getElementById("pitchP").textContent =
        pitchP.toFixed(2);

    document.getElementById("pitchI").textContent =
        pitchI.toFixed(2);

    document.getElementById("pitchD").textContent =
        pitchD.toFixed(2);

    document.getElementById("pitchOutput").textContent =
        pitchOutput.toFixed(2);


    document.getElementById("m1").textContent =
        motor1.toFixed(1);

    document.getElementById("m2").textContent =
        motor2.toFixed(1);

    document.getElementById("m3").textContent =
        motor3.toFixed(1);

    document.getElementById("m4").textContent =
        motor4.toFixed(1);
}

</script>

</body>
</html>
