<title>iPhone Flight Controller</title>

<style>

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #111;
        color: white;
        padding: 20px;
    }

    button {
        font-size: 20px;
        padding: 15px 25px;
        margin: 20px;
    }

    .sensor {
        font-size: 20px;
        margin: 15px;
        padding: 15px;
        border: 2px solid white;
        border-radius: 10px;
    }

    .axis {
        margin: 8px;
    }

</style>
```

</head>

<body>

```
<h1>iPhone Flight Controller</h1>

<button onclick="startSensors()">
    Starta sensorer
</button>


<h2>Accelerometer</h2>

<div class="sensor">

    <div class="axis">
        X: <span id="accX">0</span> m/s²
    </div>

    <div class="axis">
        Y: <span id="accY">0</span> m/s²
    </div>

    <div class="axis">
        Z: <span id="accZ">0</span> m/s²
    </div>

</div>


<h2>Gyroskop</h2>

<div class="sensor">

    <div class="axis">
        X: <span id="gyroX">0</span> °/s
    </div>

    <div class="axis">
        Y: <span id="gyroY">0</span> °/s
    </div>

    <div class="axis">
        Z: <span id="gyroZ">0</span> °/s
    </div>

</div>


<script>

    async function startSensors() {

        /*
            iOS kräver användarens tillåtelse
            för rörelsesensorer.
        */

        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function"
        ) {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {

                alert(
                    "Du måste tillåta rörelsesensorer."
                );

                return;
            }
        }

        /*
            Starta DeviceMotion
        */

        window.addEventListener(
            "devicemotion",
            handleMotion
        );

    }


    function handleMotion(event) {

        /*
            Accelerometer
        */

        const acceleration =
            event.accelerationIncludingGravity;

        if (acceleration) {

            document.getElementById("accX").textContent =
                (acceleration.x || 0).toFixed(2);

            document.getElementById("accY").textContent =
                (acceleration.y || 0).toFixed(2);

            document.getElementById("accZ").textContent =
                (acceleration.z || 0).toFixed(2);

        }


        /*
            Gyroscope
        */

        const rotation =
            event.rotationRate;

        if (rotation) {

            document.getElementById("gyroX").textContent =
                (rotation.alpha || 0).toFixed(2);

            document.getElementById("gyroY").textContent =
                (rotation.beta || 0).toFixed(2);

            document.getElementById("gyroZ").textContent =
                (rotation.gamma || 0).toFixed(2);

        }

    }

</script>
```

</body>
</html>
